name: release
# Builds the APK on a GitHub runner and attaches it to the release for the tag.
# The stock SpeechAssistant.apk is proprietary and the two big models are not in git, so the
# workflow downloads them from PRIVATE URLs kept in repository secrets:
#   STOCK_APK_URL       — direct download URL of SpeechAssistant.orig.apk (e.g. a private release asset URL with token)
#   GIGAAM_MODEL_URL    — stand/asr-android/gigaam/model.int8.onnx
#   TERA_SAMPLER_URL    — tools/tera-tts-java/assets/models/sampler_distilled_cfg3_4step.onnx
# Trigger: push a tag v*  (git tag v1.0.3 && git push origin v1.0.3)  or run manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag (e.g. v1.0.3)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-34 build-tools;34.0.0" }
      - name: fetch proprietary input + big models (from secrets)
        env:
          STOCK_APK_URL: ${{ secrets.STOCK_APK_URL }}
          GIGAAM_MODEL_URL: ${{ secrets.GIGAAM_MODEL_URL }}
          TERA_SAMPLER_URL: ${{ secrets.TERA_SAMPLER_URL }}
        run: |
          set -e
          for v in STOCK_APK_URL GIGAAM_MODEL_URL TERA_SAMPLER_URL; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set (see .github/workflows/release.yml)"; exit 1; }
          done
          curl -fsSL "$STOCK_APK_URL"    -o SpeechAssistant.orig.apk
          curl -fsSL "$GIGAAM_MODEL_URL" -o stand/asr-android/gigaam/model.int8.onnx
          curl -fsSL "$TERA_SAMPLER_URL" -o tools/tera-tts-java/assets/models/sampler_distilled_cfg3_4step.onnx
          ls -la SpeechAssistant.orig.apk stand/asr-android/gigaam/model.int8.onnx tools/tera-tts-java/assets/models/sampler_distilled_cfg3_4step.onnx
      - name: tests
        run: sh ru2zh/translate-task/tests/run_tests.sh
      - name: build
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ./build.sh ./SpeechAssistant.orig.apk "out/speechassistant-ru-$TAG.apk"
          ( cd out && sha256sum "speechassistant-ru-$TAG.apk" > "speechassistant-ru-$TAG.apk.sha256" )
          ls -la out
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            out/speechassistant-ru-${{ env.TAG }}.apk
            out/speechassistant-ru-${{ env.TAG }}.apk.sha256
          body: |
            Russian voice assistant mod for Changan A06 (C390).

            Install (no root):
            ```
            adb push speechassistant-ru-${{ env.TAG }}.apk /data/local/tmp/sa.apk
            adb shell pm install -r -d -g -t /data/local/tmp/sa.apk
            adb shell am force-stop com.incall.apps.speechassistant
            ```
            Wake with «нихао» or the steering-wheel key. Commands: COMMANDS.md. Revert: `adb shell pm uninstall com.incall.apps.speechassistant`.
